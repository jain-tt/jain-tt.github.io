[project]
name = "atlas-optimizer-mcp"
version = "0.1.0"
description = "Read-only Kubernetes right-sizing MCP server with human approval workflow (course capstone)"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2.3,<3", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optimizer_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
