[project]
name = "atlas-mcp"
version = "0.1.0"
description = "Atlas read-only operations MCP server (course lab)"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.3,<3",     # official MCP Python SDK (2.x: MCPServer, spec 2026-07-28 + 2025-11-25)
  "httpx>=0.27",          # async HTTP for Kubernetes / Prometheus / OpenCost backends
  "pydantic>=2.7",        # input and output schemas
  "pyjwt[crypto]>=2.9",   # access-token verification for the remote transport
  "uvicorn>=0.30",        # ASGI server for Streamable HTTP
  "prometheus-client>=0.20",  # /metrics endpoint
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
atlas-mcp = "atlas_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
