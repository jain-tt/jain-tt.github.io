    app.kubernetes.io/name: atlas-mcp
    app.kubernetes.io/instance: atlas-mcp
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: mcp-server
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}     # never reduce serving capacity during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-mcp
      app.kubernetes.io/instance: atlas-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-mcp
        app.kubernetes.io/instance: atlas-mcp
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/component: mcp-server
      annotations:
        checksum/config: 22dc6d04b9897fe1b66145cf85d4e6832af2608f44bb68dbd777223c0ead94bb  # restart on config change
    spec:
      serviceAccountName: atlas-mcp
      terminationGracePeriodSeconds: 30                  # > uvicorn graceful timeout (25 s)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: atlas-mcp
              app.kubernetes.io/instance: atlas-mcp
      containers:
        - name: mcp
          image: ghcr.io/example/atlas-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["--transport", "http"]
          envFrom:
            - configMapRef: {name: atlas-mcp-config}
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                                 # process alive only — never depends on backends
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                                # backends reachable -> receive traffic
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}                        # let endpoints update before SIGTERM
          resources:
            limits:
              memory: 384Mi
            requests:
              cpu: 100m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
# [END deployment]
