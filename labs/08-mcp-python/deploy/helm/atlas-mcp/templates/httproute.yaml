{{- if .Values.gateway.enabled }}
# [START httproute]
# TLS is terminated by the shared Gateway (cert-manager certificate for the hostname).
# Only /mcp and the OAuth Protected Resource Metadata path are exposed publicly;
# /metrics and /readyz stay cluster-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "atlas-mcp.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
      sectionName: {{ .Values.gateway.parentRef.sectionName }}
  hostnames: [{{ .Values.hostname | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp}
        - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource}
      backendRefs:
        - {name: {{ .Release.Name }}, port: 80}
      timeouts:
        request: 60s                                    # longer than the slowest tool (8 s backend timeout x2)
# [END httproute]
{{- end }}
