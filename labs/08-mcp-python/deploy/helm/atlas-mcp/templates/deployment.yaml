# [START deployment]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "atlas-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}     # never reduce serving capacity during a rollout
  selector:
    matchLabels: {{- include "atlas-mcp.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "atlas-mcp.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}  # restart on config change
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: 30                  # > uvicorn graceful timeout (25 s)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "atlas-mcp.selector" . | nindent 14 }}
      containers:
        - name: mcp
          image: {{ include "atlas-mcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--transport", "http"]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                                 # process alive only — never depends on backends
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                                # backends reachable -> receive traffic
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}                        # let endpoints update before SIGTERM
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
# [END deployment]
